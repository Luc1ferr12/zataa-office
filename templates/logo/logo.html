<!doctype html>
<!-- Logo brand (512×512): ?k=esports → About Esports (feed/video Marketing) · ?k=zaa → Zaa Office (web kantor).
     Render ulang: node scripts/logo.mjs -->
<html lang="id"><head><meta charset="utf-8"><title>logo</title>
<link rel="stylesheet" href="../shared/brand.css">
<style>
  html, body { margin: 0; width: 512px; height: 512px; background: transparent; overflow: hidden; }
  .tile { position: absolute; inset: 8px; border-radius: 96px; overflow: hidden;
    background: radial-gradient(120% 90% at 25% 15%, #7c2cf0 0%, #4d12b8 45%, #23075e 100%);
    box-shadow: inset 0 0 0 3px #ffffff1c; }
  .tile::after { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, #ffffff14, transparent 40%); }
  .mono { position: absolute; left: 0; right: 0; top: 70px; text-align: center; font: 800 236px/1 Sora; color: #fff;
    letter-spacing: -0.04em; transform: skewX(-9deg); text-shadow: 0 14px 0 #2a0870, 0 22px 40px #0008; }
  .mono i { font-style: normal; color: #b78bff; }
  .tri { position: absolute; width: 0; height: 0; border-left: 34px solid transparent; border-right: 34px solid transparent; border-bottom: 58px solid #9b5cff; }
  .name { position: absolute; left: 0; right: 0; top: 352px; text-align: center; font: 800 46px/1 Sora; letter-spacing: .2em; color: #fff; padding-left: .2em; }
  .sub { position: absolute; left: 0; right: 0; top: 418px; display: flex; align-items: center; justify-content: center; gap: 16px;
    font: 700 22px/1 Inter; letter-spacing: .34em; color: #c9a8ff; padding-left: .34em; }
  .sub::before, .sub::after { content: ''; width: 46px; height: 3px; background: #9b5cff; border-radius: 2px; }
</style></head>
<body><div class="tile" id="t"></div>
<script>
const k = new URLSearchParams(location.search).get('k') ?? 'esports';
const L = {
  esports: { mono: 'A<i>E</i>', name: 'ABOUT', sub: 'ESPORTS', tri: null },
  zaa: { mono: 'Z<i>A</i>', name: 'ZAA', sub: 'OFFICE', tri: null },
}[k];
document.getElementById('t').innerHTML = `<div class="mono">${L.mono}</div>${L.tri ? `<div class="tri" style="left:${L.tri[0]}px;top:${L.tri[1]}px"></div>` : ''}<div class="name">${L.name}</div><div class="sub">${L.sub}</div>`;
</script></body></html>
