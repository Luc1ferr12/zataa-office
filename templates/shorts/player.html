<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<!-- Template YouTube Shorts sejarah misteri (1080×1920). Dipakai scripts/shorts.mjs: window.setup(data) lalu window.seek(t) per frame. -->
<style>
  @font-face { font-family: Sora; font-weight: 700; src: url('../../node_modules/@fontsource/sora/files/sora-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: Sora; font-weight: 800; src: url('../../node_modules/@fontsource/sora/files/sora-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: Inter; font-weight: 500; src: url('../../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2') format('woff2'); }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #stage { position: absolute; inset: 0; overflow: hidden; z-index: 0; }   /* z-index foto antar adegan tetap di dalam stage, di bawah teks */
  .shot { position: absolute; inset: 0; opacity: 0; will-change: transform, opacity; }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: sepia(.28) saturate(.85) contrast(1.1) brightness(.82); transform-origin: 50% 50%; }
  /* gradasi gelap atas-bawah + vinyet: teks selalu kebaca, suasana misterius */
  #shade { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 85% 70% at 50% 46%, transparent 45%, #000a 100%),
      linear-gradient(#000c 0%, #0000 22%, #0000 52%, #000d 82%, #000f 100%); }
  #fx { position: absolute; inset: 0; }
  #tag { position: absolute; left: 0; right: 0; top: 150px; text-align: center; font: 700 30px/1 Sora; letter-spacing: .42em; color: #e8c98a; opacity: .9; text-shadow: 0 2px 12px #000; }
  #place { position: absolute; left: 0; right: 0; top: 205px; text-align: center; font: 500 34px/1 Inter; letter-spacing: .08em; color: #f4ead6cc; opacity: 0; text-shadow: 0 2px 10px #000; }
  #sub { position: absolute; left: 70px; right: 70px; top: 1180px; text-align: center; font: 800 86px/1.12 Sora; color: #fff; letter-spacing: -0.01em;
    text-shadow: 0 0 2px #000, 0 4px 0 #000, 0 6px 28px #000e; -webkit-text-stroke: 3px #0009; paint-order: stroke fill; text-wrap: balance; }
  #sub em { font-style: normal; color: #f2c46d; }
  /* teks hook besar di 0–2,6 dtk: frame pertama langsung "ngomong", bukan layar gelap */
  #hook { position: absolute; left: 60px; right: 60px; top: 330px; text-align: center; font: 900 96px/1.08 Sora; color: #f2c46d; letter-spacing: -0.01em;
    text-shadow: 0 0 2px #000, 0 5px 0 #000, 0 8px 34px #000; -webkit-text-stroke: 4px #000a; paint-order: stroke fill; text-wrap: balance; opacity: 0; }
  #credit { position: absolute; left: 40px; bottom: 300px; font: 500 22px/1.2 Inter; color: #fff8; text-shadow: 0 1px 4px #000; max-width: 700px; }
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="fx" width="1080" height="1920"></canvas>
<div id="shade"></div>
<div id="tag"></div>
<div id="place"></div>
<div id="sub"></div>
<div id="hook"></div>
<div id="credit"></div>
<script>
// data = { tag, scenes: [{ img, sub, place?, credit?, dur, voStart, voDur, move? }] }
// sub: teks layar (angka boleh ditulis digit, *kata* = emas), dibagi jadi potongan ≤4 kata yang muncul sesuai panjang narasi.
const XF = 0.7;   // crossfade antar adegan (detik)
let D, starts = [], total = 0, shots = [], chunks = [];
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const fmt = (s) => esc(s).replace(/\*(.+?)\*/g, '<em>$1</em>');
const ease = (x) => x * x * (3 - 2 * x);
const MOVES = ['in', 'left', 'out', 'right', 'up'];

window.setup = async (data) => {
  D = data;
  $('tag').textContent = data.tag ?? 'MISTERI NUSANTARA';
  $('hook').textContent = data.hook ?? '';
  let t = 0;
  starts = data.scenes.map((s) => { const a = t; t += s.dur; return a; });
  total = t;
  const stage = $('stage');
  shots = data.scenes.map((s, i) => {
    const el = document.createElement('div');
    el.className = 'shot';
    el.innerHTML = `<img src="${s.img}">`;
    stage.appendChild(el);
    return { el, img: el.firstChild, move: s.move ?? MOVES[i % MOVES.length] };
  });
  await Promise.all(shots.map((s) => s.img.decode().catch(() => {})));
  await document.fonts.ready;
  // potongan subtitle: ≤4 kata, waktunya proporsional panjang huruf di dalam rentang narasi
  chunks = data.scenes.map((s) => {
    const words = s.sub.split(/\s+/), parts = [];
    let cur = [];
    for (const w of words) { cur.push(w); if (cur.length >= 4 || /[.,?!…:]$/.test(w.replace(/\*/g, ''))) { parts.push(cur.join(' ')); cur = []; } }
    if (cur.length) parts.push(cur.join(' '));
    const len = parts.map((p) => p.replace(/\*/g, '').length + 4), sum = len.reduce((a, b) => a + b, 0);
    let acc = 0;
    return parts.map((p, k) => { const a = s.voStart + (acc / sum) * s.voDur; acc += len[k]; return { text: p, a, b: s.voStart + (acc / sum) * s.voDur }; });
  });
  return { total, starts };
};

// partikel debu melayang + grain (deterministik terhadap t)
const fx = $('fx').getContext('2d');
const hash = (n) => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
function drawFx(t) {
  fx.clearRect(0, 0, 1080, 1920);
  for (let i = 0; i < 70; i++) {
    const sp = 18 + hash(i) * 40, x = (hash(i + 1) * 1180 + t * sp * (hash(i + 2) - 0.3)) % 1180 - 50;
    const y = (hash(i + 3) * 2000 - t * sp * 0.6 + 2000) % 2000 - 40;
    const r = 1 + hash(i + 4) * 3.2, a = 0.12 + 0.35 * hash(i + 5) * (0.6 + 0.4 * Math.sin(t * 1.3 + i));
    fx.fillStyle = `rgba(255,226,170,${a.toFixed(3)})`;
    fx.beginPath(); fx.arc(x, y, r, 0, 7); fx.fill();
  }
}

window.seek = (t) => {
  const n = D.scenes.length;
  let cur = 0;
  for (let i = 0; i < n; i++) if (t >= starts[i]) cur = i;
  shots.forEach((s, i) => {
    const a = starts[i], d = D.scenes[i].dur;
    // tampil dari (a − XF) sampai (a + d); adegan pertama langsung muncul pelan dari hitam
    const fadeIn = i === 0 ? 1 : Math.min(1, Math.max(0, (t - (a - XF)) / XF));
    const vis = t < a - XF || t > a + d ? 0 : fadeIn;
    s.el.style.opacity = vis.toFixed(3);
    s.el.style.zIndex = i;
    if (!vis) return;
    const p = Math.min(1, Math.max(0, (t - (a - XF)) / (d + XF)));   // 0→1 sepanjang adegan
    const k = ease(p);
    let sc = 1.08 + 0.14 * k, tx = 0, ty = 0;
    if (s.move === 'out') sc = 1.24 - 0.14 * k;
    if (s.move === 'left') tx = 40 - 80 * k;
    if (s.move === 'right') tx = -40 + 80 * k;
    if (s.move === 'up') ty = 40 - 80 * k;
    s.img.style.transform = `translate(${tx}px, ${ty}px) scale(${sc.toFixed(4)})`;
  });
  // hook: penuh dari frame pertama, pudar di 2,3–2,6 dtk
  $('hook').style.opacity = D.hook ? Math.min(1, Math.max(0, (2.6 - t) / 0.3)).toFixed(2) : 0;
  // subtitle
  const c = chunks[cur].find((x) => t >= x.a - 0.05 && t < x.b + 0.25);
  const sub = $('sub');
  if (c) {
    if (sub.dataset.k !== c.text) { sub.innerHTML = fmt(c.text); sub.dataset.k = c.text; sub.dataset.t0 = c.a; }
    const age = t - c.a, pop = Math.min(1, Math.max(0, age / 0.14));
    sub.style.opacity = pop.toFixed(2);
    sub.style.transform = `translateY(${(1 - pop) * 18}px) scale(${(0.94 + 0.06 * pop).toFixed(3)})`;
  } else sub.style.opacity = 0;
  // lokasi & kredit foto per adegan
  const sc = D.scenes[cur];
  const pl = $('place');
  pl.textContent = sc.place ? `📍 ${sc.place}` : '';
  pl.style.opacity = sc.place ? Math.min(1, (t - starts[cur]) / 0.6).toFixed(2) : 0;
  $('credit').textContent = sc.credit ? `Foto: ${sc.credit}` : '';
  // akhir video: pudar ke hitam sedikit biar loop ke awal mulus
  $('stage').style.opacity = (t > total - 0.6 ? Math.max(0, (total - t) / 0.6) * 0.6 + 0.4 : 1).toFixed(2);
  drawFx(t);
};
</script>
</body>
</html>
