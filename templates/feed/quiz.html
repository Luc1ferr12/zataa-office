<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>quiz</title>
<link rel="stylesheet" href="../shared/brand.css">
<style>
  .h1 { font-size: 96px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .story .opts { grid-template-columns: 1fr; }
  .opt { display: grid; grid-template-columns: 70px 1fr; gap: 20px; align-items: center; padding: 24px 26px; }
  .opt i { font: 800 40px/70px Sora; font-style: normal; text-align: center; width: 70px; height: 70px; border-radius: 18px; color: var(--ink); background: var(--accent); }
  .opt span { font: 700 34px/1.2 Inter; }
</style></head>
<body><div id="root"></div>
<script type="module">
import { setup, shell, kicker, md, fit, ready } from '../shared/brand.js';
// data: { game, kicker: KUIS|POLLING, headline, sub, options:[2–4], cta, footnote }
window.render = async (d, size) => {
  const g = setup(d, size);
  const opts = (d.options ?? []).slice(0, 4).map((o, i) => `<div class="card opt"><i>${'ABCD'[i]}</i><span>${md(o)}</span></div>`).join('');
  document.getElementById('root').innerHTML = shell({ cta: 'Jawab di komentar 👇', ...d }, g, `
    <div class="grow"><h1 class="h1">${md(d.headline)}</h1>${d.sub ? `<p class="sub">${md(d.sub)}</p>` : ''}<div class="opts">${opts}</div></div>`,
    { kicker: kicker(d.kicker ?? 'KUIS', 'alt') });
  await ready();
  fit(document.querySelector('.h1'), 52);
};
</script></body></html>
