<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>quiz</title>
<link rel="stylesheet" href="../shared/brand.css">
<style>
  .h1 { font-size: 96px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .story .opts { grid-template-columns: 1fr; }
  .opt { display: grid; grid-template-columns: 70px 1fr; gap: 20px; align-items: center; padding: 24px 26px; }
  .opt i { font: 800 40px/70px Sora; font-style: normal; text-align: center; width: 70px; height: 70px; border-radius: 18px; color: var(--ink); background: var(--accent); }
  .opt span { font: 700 34px/1.2 Inter; }
  .opt.has-logo { grid-template-columns: 70px 84px 1fr; }
  .opt img { width: 84px; height: 84px; object-fit: contain; filter: drop-shadow(0 6px 16px #000b); }
  .opts.six { gap: 14px; }
  .six .opt { padding: 14px 22px; }
  .six .opt.has-logo { grid-template-columns: 60px 70px 1fr; }
  .six .opt i { width: 60px; height: 60px; font-size: 34px; line-height: 60px; }
  .six .opt img { width: 70px; height: 70px; }
  .six .opt span { font-size: 30px; }
</style></head>
<body><div id="root"></div>
<script type="module">
import { setup, shell, kicker, md, esc, fit, ready } from '../shared/brand.js';
// data: { game, kicker: KUIS|POLLING, headline, sub, options:[2–6 teks | {text, logo}], cta, footnote }
// logo = path logo tim (mis. assets/teams/onic.png) → tampil di samping opsi; 5–6 opsi = kartu ringkas
window.render = async (d, size) => {
  const g = setup(d, size);
  const list = (d.options ?? []).slice(0, 6);
  const opts = list.map((o, i) => {
    const { text, logo } = typeof o === 'string' ? { text: o } : o;
    const img = logo ? `<img src="/${esc(logo.replace(/^\/+/, ''))}" alt="">` : '';
    return `<div class="card opt${logo ? ' has-logo' : ''}"><i>${'ABCDEF'[i]}</i>${img}<span>${md(text)}</span></div>`;
  }).join('');
  document.getElementById('root').innerHTML = shell({ cta: 'Jawab di komentar 👇', ...d }, g, `
    <div class="grow"><h1 class="h1">${md(d.headline)}</h1>${d.sub ? `<p class="sub">${md(d.sub)}</p>` : ''}<div class="opts${list.length > 4 ? ' six' : ''}">${opts}</div></div>`,
    { kicker: kicker(d.kicker ?? 'KUIS', 'alt') });
  await ready();
  fit(document.querySelector('.h1'), 52);
};
</script></body></html>
