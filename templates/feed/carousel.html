<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>carousel</title>
<link rel="stylesheet" href="../shared/brand.css">
<style>
  .topline { display: flex; justify-content: space-between; align-items: center; }
  .count { font: 800 28px/1 Sora; letter-spacing: .08em; padding: 12px 20px; border-radius: 14px; background: #ffffff14; border: 2px solid #ffffff26; }
  .dots { display: flex; gap: 10px; }
  .dots i { width: 16px; height: 16px; border-radius: 50%; background: #ffffff33; }
  .dots i.on { width: 46px; border-radius: 10px; background: var(--accent); }
  .swipe { font: 800 34px/1 Sora; color: var(--accent); }
  .pt-n { font: 800 200px/0.8 Sora; color: transparent; -webkit-text-stroke: 4px var(--accent); }
  .h2.pt { font-size: 72px; }
  .body { font: 500 42px/1.4 Inter; color: #efe9ff; text-wrap: pretty; }
  .h1.hook { font-size: 124px; }
  .tlogos { display: flex; gap: 22px; align-items: center; }
  .tlogos img { width: 120px; height: 120px; object-fit: contain; filter: drop-shadow(0 8px 22px #000b); }
  .tlogos.big img { width: 220px; height: 220px; }
  .pre { font: 800 34px/1 Sora; letter-spacing: .3em; color: var(--accent); }
  /* hook + photo: foto tim/pemain di atas, nuansa ungu, judul besar di bawah (seperti news) */
  .photo { position: absolute; left: 0; right: 0; top: 0; height: 74%; overflow: hidden; }
  .story .photo { height: 62%; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; filter: saturate(.85) contrast(1.05); }
  .photo::before { content: ''; position: absolute; inset: 0; background: linear-gradient(160deg, #5b1fd6, #2a0a6b); mix-blend-mode: color; opacity: .55; }
  .photo::after { content: ''; position: absolute; inset: 0;
    background: linear-gradient(180deg, #12052fcc 0%, transparent 22%, transparent 48%, #12052f 96%), radial-gradient(70% 60% at 50% 40%, transparent, #2a0a6b66); }
  .with-photo .watermark { display: none; }
  .with-photo .grow { justify-content: flex-end; gap: 14px; text-align: center; align-items: center; }
  .with-photo .tlogos { justify-content: center; }
  .with-photo .h1.hook { font-size: 132px; line-height: .95; text-transform: uppercase; text-shadow: 0 6px 30px #0009; }
  .with-photo .pre { color: var(--white); text-shadow: 0 4px 20px #000a; }
  .with-photo .sub { font-size: 30px; color: #e6dcff; max-width: 92%; }
  .with-photo .swipe { text-align: right; }
  /* point + photo: foto pemain, nomor kecil, judul & isi di bawah */
  .with-photo .pt-n { font-size: 90px; -webkit-text-stroke: 3px var(--accent); }
  .with-photo .h2.pt { font-size: 84px; text-transform: uppercase; text-shadow: 0 6px 30px #0009; }
  .with-photo .body { font-size: 32px; max-width: 92%; text-shadow: 0 4px 20px #000a; }
  .cta-logo { width: 220px; height: 220px; border-radius: 48px; box-shadow: 0 20px 60px #0009, 0 0 0 4px #ffffff22; }
</style></head>
<body><div id="root"></div>
<script type="module">
import { setup, shell, md, esc, fit, ready, footer } from '../shared/brand.js';
// data: { game, slides:[{kind:'hook', headline, sub} | {kind:'point', title, body} | {kind:'cta', headline, sub}], cta } ; opts.slide = indeks
window.render = async (d, size, opts = {}) => {
  const g = setup(d, size);
  const n = d.slides.length, i = opts.slide ?? 0, s = d.slides[i];
  const dots = `<div class="dots">${d.slides.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>`;
  const top = `<div class="topline">${dots}<span class="count">${i + 1}/${n}</span></div>`;
  // logo (hook/point) = path logo tim (string / array, mis. assets/teams/rrq.png) → tampil di atas judul
  const logos = [s.logo ?? []].flat().filter(Boolean);
  const logoRow = logos.length ? `<div class="tlogos">${logos.map((l) => `<img src="/${esc(l.replace(/^\/+/, ''))}" alt="">`).join('')}</div>` : '';
  let inner;
  const withPhoto = !!(s.kind !== 'cta' && s.photo);
  document.body.classList.toggle('with-photo', withPhoto);
  if (s.kind === 'hook') {
    // photo = foto tim/pemain (mis. assets/photos/x.jpg) → layout foto; pre = teks kecil di atas judul; logo tanpa foto tampil besar (maks 3 logo, lebih dari itu ukuran biasa biar nggak kepotong)
    const row = s.photo || logos.length > 3 ? logoRow : logoRow.replace('class="tlogos"', 'class="tlogos big"');
    inner = `<div class="grow">${row}${s.pre ? `<div class="pre">${md(s.pre)}</div>` : ''}<h1 class="h1 hook">${md(s.headline)}</h1>${s.sub ? `<p class="sub">${md(s.sub)}</p>` : ''}</div><div class="swipe">Geser ➜</div>`;
  } else if (s.kind === 'cta') {
    const logo = new URL('../../docs/assets/logo.png', location.href).href;
    inner = `<div class="grow"><img class="cta-logo" src="${logo}" alt=""><h1 class="h1">${md(s.headline ?? 'Top up sekarang!')}</h1>${s.sub ? `<p class="sub">${md(s.sub)}</p>` : ''}</div>${footer(d)}`;
  } else {
    const num = s.n ?? i;
    inner = `<div class="grow">${logoRow}<div class="pt-n">${esc(String(num).padStart(2, '0'))}</div><h2 class="h2 pt">${md(s.title)}</h2>${s.body ? `<p class="body">${md(s.body)}</p>` : ''}</div><div class="swipe">Geser ➜</div>`;
  }
  let html = shell(d, g, top + inner, { foot: false });
  if (withPhoto) html = html.replace('<div class="bg"></div>', `<div class="bg"></div><div class="photo"><img src="/${esc(s.photo.replace(/^\/+/, ''))}" alt=""></div>`);
  document.getElementById('root').innerHTML = html;
  await ready();
  fit(document.querySelector('.h1, .h2'), 52);
};
</script></body></html>
